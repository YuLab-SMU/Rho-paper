<text x="82" y="454" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="20" fill="#4b625a">actions · resources · selections · views — each with owner, version and provenance</text>
<text x="82" y="478" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="20" fill="#4b625a">observed computation fact    |    agent interpretation    |    human judgment</text>
<text x="82" y="502" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="18" fill="#3f7864">local service on the machine  ·  no Rho server  ·  the browser has no shell, filesystem or Core access</text>
