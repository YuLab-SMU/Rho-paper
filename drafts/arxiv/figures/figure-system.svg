<text x="256.0" y="242" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="20" text-anchor="middle" fill="#4b625a">R analysis · Agent bridge</text>
<text x="256.0" y="267" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="20" text-anchor="middle" fill="#4b625a">tables &amp; plots · editor &amp; files</text>
